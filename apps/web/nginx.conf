server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota cai no index.html e o React Router resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Pyodide e sql.js carregam .wasm; sem o tipo certo o navegador recusa.
  types {
    application/wasm wasm;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm;
}
